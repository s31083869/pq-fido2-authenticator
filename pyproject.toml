[project]
name = "pq-fido2-authenticator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cbor2>=5.6.0",
    "fido2>=2.0.0",
    "flask>=3.1.2",
    "flask-cors>=6.0.1",
    "keyring>=25.6.0",
    "liboqs-python>=0.14.1",
    "playwright>=1.55.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.11.0",
    "pyobjc>=12.0; sys_platform == 'darwin'",
    "sqlalchemy>=2.0.44",
    "winsdk>=1.0.0b10; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=8.4.2",
    "ruff>=0.14.4",
]

[tool.pytest.ini_options]
# 只在專案自己的測試資料夾找測試。沒有這個設定時，在根目錄執行 pytest 會掃進
# extension/emsdk 裡第三方套件的範例程式並執行它們（曾因此在根目錄產生多餘檔案）。
# tests/integration 是跨元件（authenticator ↔ RP）的整合測試（Day 5 起）。
testpaths = ["authenticator/tests", "rp_server/tests", "shared/tests", "tests/integration"]
